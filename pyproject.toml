[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fedfleet"
version = "0.1.0"
description = "FedFleet: communication-efficient federated learning on a hybrid multicloud (SE-315)"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "flwr[simulation]==1.38.0",
    "torch>=2.4",
    "numpy>=1.26",
]

[tool.hatch.build.targets.wheel]
packages = ["fedfleet"]

[tool.flwr.app]
publisher = "fedfleet"

[tool.flwr.app.components]
serverapp = "fedfleet.server_app:app"
clientapp = "fedfleet.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 10
fraction-train = 1.0
min-nodes = 2               # a round starts with and is aggregated from at least this many sites
round-timeout = 120.0       # seconds; slower or offline nodes are skipped for the round
local-epochs = 1
batch-size = 64
lr = 0.001                  # head-only rate chosen in E9 (21 Oct); full model uses lr=0.0005
seed = -1                   # >= 0: training seed for repetitions; -1 = fixed seed (identical reruns)
head-only = true            # true = exchange only the task head; false = full model (E9 baseline)
site-eval = true            # false = skip the sites' own evaluation (saves one exchange per round)
num-classes = 11
dirichlet-alpha = 0.5       # non-IID level of the client partitions
data-path = ""              # e.g. "~/fedfleet/data/RML2016.10a_dict.pkl"; empty = synthetic data
public-data-path = ""       # e.g. "~/fedfleet/data/radioml_public_test.pt": the server's test split only
backbone-path = ""          # e.g. "~/fedfleet/backbone.pt"; empty = seeded random backbone
metrics-dir = "~/fedfleet-runs"  # per-round JSONL metrics and checkpoints
resume = false              # resume from <metrics-dir>/latest_checkpoint.pt
rates-path = ""             # e.g. "~/fedfleet/deploy/rates.toml" on the aggregator; empty = no cost per round
compression = "none"        # update compression sites -> aggregator: none, int8, topk, topk-int8 (fedfleet/compress.py)
topk-ratio = 0.1            # share of each tensor's values kept in the topk modes
error-feedback = true       # sites carry what compression dropped into their next update
dp = false                  # central differential privacy, client-side clipping (fedfleet/comms.py); not with compression
dp-noise-multiplier = 1.0   # Gaussian noise std = multiplier x clip norm / sites; 0 = clipping only
dp-clip-norm = 1.5          # L2 bound on each site's update (measured norms about 1.5 after round 1)
dp-delta = 0.00001          # delta at which epsilon is reported
dp-max-epsilon = 0.0     # > 0: stop before a round would take epsilon past this (needs dp and noise > 0); 0 = no budget
secagg = false              # secure aggregation (SecAgg+, fedfleet/secagg.py); works with dp, not with compression
secagg-max-weight = 60000.0 # at least the largest site's sample count (weights are num_examples / this)
secagg-clipping-range = 8.0 # SecAgg+ clips each weighted parameter to +-this before quantising

[tool.ruff.lint]
# CI starts with the rules that catch real bugs; style rules get added later, one at a time.
select = ["E9", "F"]

