apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-superlink
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: superlink
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - { name: control, port: 8000, targetPort: 8000 }
    - { name: fleet, port: 9092, targetPort: 9092 }
