name: Task from the plan
description: One task from the FedFleet plan of record (layers 1-5, WBS ids)
labels: [task]
body:
  - type: input
    id: wbs
    attributes: { label: "WBS id and name", placeholder: "15.2 Integration suite in CI" }
    validations: { required: true }
  - type: dropdown
    id: layer
    attributes:
      label: Layer
      options: ["1 Communication core", "2 Efficient communication and elasticity", "3 Privacy and resilience", "4 Platform", "5 Production hardening", "Reports"]
    validations: { required: true }
  - type: textarea
    id: done
    attributes: { label: "Done when", description: "The evidence that closes it: a run, a drill, a test, a measurement" }
    validations: { required: true }
  - type: textarea
    id: depends
    attributes: { label: "Depends on", placeholder: "e.g. 2.4 (k3s), the image (3.6)" }
