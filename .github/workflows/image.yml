name: image
# Builds the FedFleet image for linux/amd64 and linux/arm64 (task 3.6). On a pull request it
# builds both and smoke-tests the amd64 one; on main it also publishes to ghcr.io/ra-1020/fedfleet,
# tagged with the commit (sha-<short>) and latest.
on:
  pull_request:
    paths:
      - deploy/local/Dockerfile
      - .dockerignore
      - fedfleet/**
      - pyproject.toml
      - .github/workflows/image.yml
  push:
    branches: [main]
    paths:
      - deploy/local/Dockerfile
      - .dockerignore
      - fedfleet/**
      - pyproject.toml
      - .github/workflows/image.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write            # only used to push on main
    env:
      IMAGE: ghcr.io/ra-1020/fedfleet   # registry names must be lower case
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build amd64 for the smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/local/Dockerfile
          platforms: linux/amd64
          load: true
          tags: fedfleet:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run --rm fedfleet:test sh -c '
            set -e
            test "$(id -u)" = 10001 || { echo "runs as uid $(id -u), expected 10001"; exit 1; }
            python -c "import fedfleet, flwr; print(\"flwr\", flwr.__version__)"
            flower-superlink --help >/dev/null
            flower-supernode --help >/dev/null
            flower-superexec --help >/dev/null
            for d in /app/keys /app/certificates /app/data; do test ! -e "$d" || { echo "unexpected $d in image"; exit 1; }; done
            echo smoke-ok'

      - name: Log in to GitHub's registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build amd64 and arm64 (push on main)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/local/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
